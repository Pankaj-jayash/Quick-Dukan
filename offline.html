<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2E7D32">
    <title>Quick Dukan - ऑफ़लाइन</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif;
            background: linear-gradient(135deg, #E8F5E9 0%, #C8E6C9 50%, #A5D6A7 100%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        /* Background floating elements */
        .bg-circle {
            position: fixed;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            animation: float 6s ease-in-out infinite;
        }

        .bg-circle:nth-child(1) {
            width: 200px;
            height: 200px;
            top: -50px;
            left: -50px;
            animation-delay: 0s;
        }

        .bg-circle:nth-child(2) {
            width: 150px;
            height: 150px;
            bottom: -30px;
            right: -30px;
            animation-delay: 2s;
        }

        .bg-circle:nth-child(3) {
            width: 100px;
            height: 100px;
            top: 50%;
            left: 10%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        /* Main card */
        .offline-card {
            background: white;
            border-radius: 28px;
            padding: 40px 30px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(46, 125, 50, 0.2);
            position: relative;
            z-index: 1;
            animation: cardIn 0.6s ease;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .offline-icon {
            font-size: 80px;
            display: block;
            animation: bounceIcon 2s ease-in-out infinite;
        }

        @keyframes bounceIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .offline-title {
            font-size: 24px;
            font-weight: 900;
            color: #2E7D32;
            margin-top: 16px;
        }

        .offline-subtitle {
            font-size: 15px;
            color: #558B2F;
            margin-top: 8px;
            font-weight: 500;
        }

        .offline-message {
            background: #FFF9C4;
            border: 1px solid #FFE082;
            border-radius: 16px;
            padding: 16px;
            margin-top: 20px;
            font-size: 13px;
            color: #F57F17;
            line-height: 1.6;
            font-weight: 500;
        }

        .offline-message .highlight {
            display: block;
            font-size: 18px;
            margin-bottom: 6px;
        }

        .offline-features {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .feature-tag {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: #E8F5E9;
            color: #2E7D32;
        }

        .retry-btn {
            display: inline-block;
            margin-top: 24px;
            padding: 14px 36px;
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(46, 125, 50, 0.3);
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(46, 125, 50, 0.4);
        }

        .retry-btn:active {
            transform: scale(0.95);
        }

        .dots {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 16px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2E7D32;
            opacity: 0.4;
            animation: dotPulse 1.4s infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotPulse {
            0%, 80%, 100% { opacity: 0.3; transform: scale(1); }
            40% { opacity: 1; transform: scale(1.3); }
        }

        /* Dark mode */
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #1B5E20 0%, #0D3B0F 50%, #1A1A1A 100%);
            }
            .offline-card {
                background: #1E1E1E;
                box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            }
            .offline-title { color: #81C784; }
            .offline-subtitle { color: #A5D6A7; }
            .offline-message {
                background: #3E2723;
                border-color: #5D4037;
                color: #FFCC80;
            }
            .feature-tag {
                background: #1B5E20;
                color: #81C784;
            }
            .dot { background: #81C784; }
        }
    </style>
</head>
<body>
    <div class="bg-circle"></div>
    <div class="bg-circle"></div>
    <div class="bg-circle"></div>

    <div class="offline-card">
        <span class="offline-icon">📴</span>
        <h1 class="offline-title">आप ऑफ़लाइन हैं!</h1>
        <p class="offline-subtitle">लेकिन चिंता मत करो — हम आपके साथ हैं 💚</p>

        <div class="offline-message">
            <span class="highlight">💪 अच्छी खबर!</span>
            Quick Dukan ऐप ऑफ़लाइन भी काम करता है! 
            आप पहले देखे गए प्रोडक्ट ब्राउज़ कर सकते हैं। 
            इंटरनेट आते ही सब कुछ अपडेट हो जाएगा।
        </div>

        <div class="offline-features">
            <span class="feature-tag">🛒 प्रोडक्ट देखें</span>
            <span class="feature-tag">📋 पुराने ऑर्डर</span>
            <span class="feature-tag">🔍 खोजें</span>
        </div>

        <button class="retry-btn" onclick="location.reload()">
            🔄 फिर से कोशिश करें
        </button>

        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <script>
        // Auto retry every 5 seconds
        setInterval(() => {
            if (navigator.onLine) {
                window.location.href = '/quick-dukan/';
            }
        }, 5000);
    </script>
</body>
</html>
